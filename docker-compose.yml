version: '3.8'

services:
  web:
    build: .
    container_name: omnifinance_app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=False
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=llama-3.1-8b-instant
      - DATABASE_URL=sqlite:///./finance_platform.db
    volumes:
      - finance_data:/app
    restart: unless-stopped

volumes:
  finance_data:
