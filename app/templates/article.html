{% extends "base.html" %}

{% block title %}{{ title }} · OmniFinance{% endblock %}

{% block content %}
<div class="container" style="padding-top: 40px; padding-bottom: 60px; max-width: 860px;">
  <div style="margin-bottom: 24px;">
    <a href="/{{ country_code }}/{{ lang }}/" style="font-size: 0.85rem; color: var(--text-muted);">← Back to {{ current_country_pack.name }} Home</a>
    <h1 style="font-size: 2.4rem; font-weight: 900; letter-spacing: -0.02em; margin-top: 12px; margin-bottom: 12px;">
      {{ title }}
    </h1>
    <div style="font-size: 0.85rem; color: var(--text-muted);">Last updated: {{ updated_date | default('2026-01-15') }}</div>
  </div>

  <div class="card" style="line-height: 1.8; font-size: 1.05rem; color: var(--text-secondary);">
    {{ content | safe }}
  </div>
</div>
{% endblock %}
