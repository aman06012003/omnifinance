<!DOCTYPE html>
<html lang="{{ lang }}" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}OmniFinance | Multi-Country Financial Intelligence{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Precise multi-country financial calculators, tax engines, mortgage simulations, and AI-driven fiscal optimization.{% endblock %}">

  <!-- OpenGraph -->
  <meta property="og:title" content="{% block og_title %}OmniFinance Platform{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Accurate financial calculators and Groq AI tax intelligence.{% endblock %}">
  <meta property="og:type" content="website">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/static/css/style.css">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>▲</text></svg>">

  {% block extra_head %}{% endblock %}
</head>
<body>
  {% include "partials/nav.html" %}

  <main>
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}
  {% include "partials/consent.html" %}

  <script src="/static/js/theme.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
